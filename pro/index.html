<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#EC4899" />
    <meta
      name="description"
      content="Developer's Paradise - Cutting-edge Web, Mobile, and Enterprise Software Engineering by visionary creators."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Archivo (headings) + Space Grotesk (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Developer's Paradise</title>
  </head>
  <body class="bg-[#FDF2F8] dark:bg-slate-950 text-[#1E293B] dark:text-slate-100 antialiased selection:bg-[#EC4899] selection:text-white transition-colors duration-300">

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
